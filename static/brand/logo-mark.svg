<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Shipmark">
  <!-- Struck slash: a slash and a full stop cut out of a square. Both are 8 units wide (one punch);
