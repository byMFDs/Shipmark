{% load i18n static ui %}{# Sticker picker (composer.js). Hidden without JS: then the <select> next to it does the same job. #}
<div class="sticker-picker" role="dialog" aria-modal="false" aria-labelledby="{{ prefix }}-picker-title" hidden data-picker>
  <div class="sticker-picker__head">
    <h3 class="label" id="{{ prefix }}-picker-title">{% translate "Stickers" %}</h3>
    <button class="btn btn--quiet btn--icon" type="button" data-picker-close aria-label="{% translate 'Close' %}">{% icon "close" %}</button>
  </div>
  <label class="visually-hidden" for="{{ prefix }}-picker-search">{% translate "Search stickers" %}</label>
  <input class="input sticker-picker__search" type="search" id="{{ prefix }}-picker-search" placeholder="{% translate 'Search stickers' %}" autocomplete="off" data-picker-search>
  <p class="label sticker-picker__group" data-picker-recent-title hidden>{% translate "Recent" %}</p>
  <div class="sticker-picker__grid" data-picker-recent role="group" aria-label="{% translate 'Recent' %}"></div>
  <p class="label sticker-picker__group">{% translate "All stickers" %}</p>
  <div class="sticker-picker__grid" data-picker-grid role="group" aria-label="{% translate 'All stickers' %}">
    {% for key, label in form.fields.sticker.widget.choices %}{% if key %}<button class="sticker-picker__item" type="button" data-sticker="{{ key }}" data-label="{{ label|lower }} {{ key }}" title="{{ label }}" aria-label="{{ label }}"><img src="{% static 'stickers/'|add:key|add:'.svg' %}" width="48" height="48" alt="" loading="lazy"></button>{% endif %}{% endfor %}
  </div>
  <p class="muted sticker-picker__none" hidden data-picker-none>{% translate "No sticker matches." %}</p>
</div>
