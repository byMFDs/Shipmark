{# Марка: зароблена (зелена) або «ще ні» (пунктир). #}{% load i18n %}<span class="hallmark hallmark--{{ size }} {% if earned %}is-earned{% else %}is-unearned{% endif %}" data-kind="{{ kind }}"><span class="hallmark__chip"><svg class="hallmark__glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">{% if earned %}<path d="M3 8.5l3 3 7-7.5"/>{% else %}<circle cx="8" cy="8" r="3"/>{% endif %}</svg><span class="hallmark__label">{{ label }}</span>{% if not earned %} <span class="hallmark__state{% if size == 's' %} visually-hidden{% endif %}">{% translate "Not yet" %}</span>{% endif %}</span>{% if fact and size == "l" %} <span class="hallmark__fact">{{ fact }}</span>{% endif %}</span>
