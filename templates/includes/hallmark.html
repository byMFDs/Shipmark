{% load i18n %}<span class="hallmark hallmark--{{ size }} {% if earned %}is-earned{% else %}is-unearned{% endif %}"><svg class="hallmark__mark" viewBox="0 0 {{ geo.w }} {{ geo.vh }}" width="{{ geo.w }}" height="{{ geo.vh }}" aria-hidden="true" focusable="false"><path class="hm-outline" d="{{ geo.outline }}"/><path class="hm-glyph" fill-rule="evenodd" d="{{ geo.glyph }}"/><path class="hm-solid" fill-rule="evenodd" d="{{ geo.solid }}"/><path class="hm-shade" d="{{ geo.shade }}"/><path class="hm-lip" d="{{ geo.lip }}"/></svg><span class="hallmark__text{% if size == 's' %} visually-hidden{% endif %}"><span class="hallmark__label">{{ label }}</span>{% if not earned %} <span class="hallmark__state">{% translate "Not yet" %}</span>{% endif %}{% if fact and size == "l" %} <span class="hallmark__fact">{{ fact }}</span>{% endif %}</span></span>
