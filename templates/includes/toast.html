{# Один тост (інформація або помилка). #}{% load i18n ui %}<div class="toast{% if kind == 'error' %} toast--error{% endif %}" data-toast{% if kind == "error" %} role="alert"{% endif %}>{% icon "alert" "toast__icon" %}<p class="toast__text">{{ text }}</p><button type="button" class="btn btn--quiet btn--icon needs-js" data-toast-close aria-label="{% translate 'Close' %}">{% icon "close" %}</button></div>
