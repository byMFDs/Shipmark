{% load i18n ui %}{# One-click GitHub sign-in (a CSRF-protected POST). Falls back to the sign-in page when OAuth is not set up. #}
{% if github_configured %}
  <form class="inline-form" method="post" action="{% url 'github_login' %}">
    {% csrf_token %}
    <input type="hidden" name="process" value="login">
    <button class="btn btn--primary" type="submit">{% icon "github" %}{% translate "Sign in with GitHub" %}</button>
  </form>
{% else %}
  <a class="btn btn--primary" href="{% url 'account_login' %}">{% icon "github" %}{% translate "Sign in with GitHub" %}</a>
{% endif %}
