{# Small cover for list rows: first screenshot, or the first letter of the name. #}
{% with cover=project.cover %}
  {% if cover %}
    <img class="project-thumb" src="{{ cover.list_image.url }}" width="80" height="56" alt="" loading="lazy">
  {% else %}
    <span class="project-thumb project-thumb--empty" aria-hidden="true">{{ project.name|slice:":1"|upper }}</span>
  {% endif %}
{% endwith %}
